
spring:
  datasource:
    url: jdbc:h2:mem:adsentry_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

adsentry:
  app:
    version: 0.0.1-SNAPSHOT-LOCAL
    shared-workspace-warning: "Local development environment. Do not upload sensitive credentials or unredacted PII."
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
