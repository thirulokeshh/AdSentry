spring:
  application:
    name: adsentry-backend-test
  datasource:
    url: jdbc:h2:mem:adsentry_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

adsentry:
  app:
    version: 0.0.1-SNAPSHOT-TEST
    shared-workspace-warning: "Test environment active."
  cors:
    allowed-origins: http://localhost:5173
